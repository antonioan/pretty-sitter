name: Documentation Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'scripts/validate-*.py'
      - 'mkdocs.yml'
      - '.github/workflows/validate-docs.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'scripts/validate-*.py'
      - 'mkdocs.yml'
      - '.github/workflows/validate-docs.yml'

jobs:
  validate-code-examples:
    name: Validate Code Examples
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Install optional dependencies that might be used in examples
        pip install tree-sitter-python tree-sitter-javascript tree-sitter-java tree-sitter-c || true
    
    - name: Validate code examples
      run: |
        python scripts/validate-code-examples.py --verbose --fail-on-error
    
    - name: Upload validation results
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: code-validation-results
        path: |
          validation-report.txt
        retention-days: 7

  validate-docs-structure:
    name: Validate Documentation Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install MkDocs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material mkdocstrings[python] pyyaml
    
    - name: Validate documentation structure
      run: |
        python scripts/validate-docs.py
    
    - name: Test MkDocs build
      run: |
        mkdocs build --strict

  comprehensive-lint:
    name: Comprehensive Documentation Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Install optional dependencies that might be used in examples
        pip install tree-sitter-python tree-sitter-javascript tree-sitter-java tree-sitter-c || true
    
    - name: Install Node.js linting tools
      run: |
        npm install -g markdownlint-cli cspell markdown-link-check
    
    - name: Run comprehensive documentation linting
      run: |
        python scripts/lint-docs.py --verbose --fail-on-error --output lint-results.json
    
    - name: Upload linting results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: documentation-lint-results
        path: |
          lint-results.json
        retention-days: 7
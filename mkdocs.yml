site_name: Pretty Sitter Documentation
site_description: Pretty printer for tree-sitter parse trees
site_author: Antonio Abu Nassar
site_url: https://antonioan.github.io/pretty-sitter

repo_name: antonioan/pretty-sitter
repo_url: https://github.com/antonioan/pretty-sitter

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Basic Examples: getting-started/basic-examples.md
  - User Guides:
    - Configuration Guide: guides/configuration-guide.md
    - Advanced Usage: guides/advanced-usage.md
    - Integration Examples: guides/integration-examples.md
  - API Reference:
    - PrettySitter: reference/api/pretty-sitter.md
    - Colorer: reference/api/colorer.md
    - Config: reference/api/config.md
    - Configuration Options: reference/configuration-options.md
  - Troubleshooting:
    - Common Issues: troubleshooting/common-issues.md
    - FAQ: troubleshooting/faq.md
  - Contributing:
    - Development Setup: contributing/development-setup.md
    - Coding Standards: contributing/coding-standards.md
    - Architecture: contributing/architecture.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/antonioan/pretty-sitter
  version:
    provider: mike